name: Build & Deploy Dashboard

on:
  push:
    branches:
      - master

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/mon-dashboard:latest

      - name: Install cloudflared
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 \
            -o /usr/local/bin/cloudflared
          chmod +x /usr/local/bin/cloudflared
          cloudflared --version

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Deploy via SSH over Cloudflare Tunnel
        env:
          CF_HOST: ${{ secrets.CF_TUNNEL_HOST }}
          DOCKER_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ProxyCommand="cloudflared access ssh --hostname %h" \
              -i ~/.ssh/id_ed25519 \
              ${SSH_USER}@${CF_HOST} \
              "docker pull ${DOCKER_USER}/mon-dashboard:latest && \
               docker stop dashboard || true && \
               docker rm dashboard || true && \
               docker run -d \
                 --name dashboard \
                 --restart unless-stopped \
                 -p 8501:8501 \
                 ${DOCKER_USER}/mon-dashboard:latest"